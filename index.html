<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Food Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1430;
    --surface:#171F42;
    --surface-2:#1E2850;
    --elev:#26326A;
    --border:#2C3968;
    --border-soft:#232E58;
    --text:#EAF0FF;
    --muted:#8C99C4;
    --faint:#5C6996;

    /* macro accents (cool-jewel palette) */
    --cal:#4895EF;  --cal-rgb:72,149,239;
    --pro:#B26BFF;  --pro-rgb:178,107,255;
    --carb:#4CC9F0; --carb-rgb:76,201,240;
    --fat:#E84BC8;  --fat-rgb:232,75,200;
    --fib:#33C4B0;  --fib-rgb:51,196,176;

    --acc:#00B4D8;  --acc-rgb:0,180,216;
    --acc-soft:rgba(0,180,216,0.16);
    --ok:#33C4B0;
    --bad:#E84BC8;

    --radius:14px;
    --font:'Inter',system-ui,-apple-system,sans-serif;
    --head:'Space Grotesk','Inter',system-ui,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{font-family:var(--font);color:var(--text);min-height:100vh;padding-bottom:56px;-webkit-font-smoothing:antialiased;}
  input,select,button{font-family:var(--font);}
  ::placeholder{color:var(--faint);opacity:1;}

  .header{padding:26px 18px 0;max-width:820px;margin:0 auto;}
  .header h1{font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:-0.4px;}
  .header p{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:0.09em;text-transform:uppercase;}

  .content{max-width:820px;margin:18px auto 0;padding:0 18px;}

  .block-label{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;}

  /* HISTORY */
  .history-section{margin-bottom:16px;}
  .history-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .history-scroll::-webkit-scrollbar{display:none;}
  .history-chip{flex:0 0 auto;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:8px 14px;cursor:pointer;transition:.15s;text-align:center;}
  .history-chip:hover{border-color:var(--acc);}
  .history-chip.active{background:var(--acc);border-color:var(--acc);}
  .history-chip.active .chip-date,.history-chip.active .chip-cals,.history-chip.active .chip-pro,.history-chip.active .chip-surplus{color:#04121e;}
  .chip-date{font-family:var(--head);font-size:12px;font-weight:600;display:block;}
  .chip-cals{font-size:10px;color:var(--cal);display:block;margin-top:2px;font-variant-numeric:tabular-nums;}
  .chip-pro{font-size:10px;color:var(--pro);display:block;font-variant-numeric:tabular-nums;}
  .chip-surplus{font-size:10px;display:block;color:var(--muted);font-variant-numeric:tabular-nums;}
  .history-chip.goal-met{background:rgba(var(--fib-rgb),0.12);border-color:var(--fib);}
  .history-chip.goal-met .chip-date,.history-chip.goal-met .chip-cals,.history-chip.goal-met .chip-pro,.history-chip.goal-met .chip-surplus{color:var(--fib);}
  .history-chip.goal-missed{background:rgba(var(--fat-rgb),0.12);border-color:var(--fat);}
  .history-chip.goal-missed .chip-date,.history-chip.goal-missed .chip-cals,.history-chip.goal-missed .chip-pro,.history-chip.goal-missed .chip-surplus{color:var(--fat);}
  .history-chip.active.goal-met{background:var(--fib);border-color:var(--fib);}
  .history-chip.active.goal-met .chip-date,.history-chip.active.goal-met .chip-cals,.history-chip.active.goal-met .chip-pro,.history-chip.active.goal-met .chip-surplus{color:#04160f;}
  .history-chip.active.goal-missed{background:var(--fat);border-color:var(--fat);}
  .history-chip.active.goal-missed .chip-date,.history-chip.active.goal-missed .chip-cals,.history-chip.active.goal-missed .chip-pro,.history-chip.active.goal-missed .chip-surplus{color:#fff;}
  .hint{font-size:12px;color:var(--muted);font-style:italic;padding:8px 0;}

  /* DATE BAR */
  .date-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;}
  .date-bar label{font-size:10px;color:var(--faint);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;}
  .date-bar input[type="date"]{font-family:var(--head);font-size:16px;font-weight:600;border:none;background:transparent;color:var(--text);cursor:pointer;flex:1;color-scheme:dark;}
  .date-bar input[type="date"]:focus{outline:none;}
  .today-btn{font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;padding:6px 12px;border:1.5px solid var(--border);border-radius:16px;background:transparent;color:var(--muted);cursor:pointer;transition:.15s;}
  .today-btn:hover{border-color:var(--acc);color:var(--acc);}

  /* TARGETS */
  .targets-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;}
  .target-field{display:flex;flex-direction:column;gap:5px;flex:1;}
  .target-field label{font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--faint);}
  .target-input{font-family:var(--head);font-size:16px;font-weight:600;padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);width:100%;transition:border-color .15s;font-variant-numeric:tabular-nums;}
  .target-input:focus{outline:none;border-color:var(--acc);}
  .save-targets-btn{font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:0.04em;padding:10px 16px;border:none;border-radius:9px;background:var(--acc);color:#04121e;cursor:pointer;transition:.15s;white-space:nowrap;align-self:flex-end;}
  .save-targets-btn:hover{filter:brightness(1.08);}
  .save-targets-btn.saved{background:var(--ok);}

  /* MACRO SUMMARY */
  .macro-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px;}
  .macro-card{border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;}
  .macro-card .macro-val{font-family:var(--head);font-size:19px;font-weight:700;display:block;line-height:1.1;font-variant-numeric:tabular-nums;}
  .macro-card .macro-lbl{font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-top:4px;display:block;}
  .macro-card.cal{border-top:3px solid var(--cal);background:rgba(var(--cal-rgb),0.10);}  .macro-card.cal .macro-val{color:var(--cal);}
  .macro-card.pro{border-top:3px solid var(--pro);background:rgba(var(--pro-rgb),0.10);}  .macro-card.pro .macro-val{color:var(--pro);}
  .macro-card.carb{border-top:3px solid var(--carb);background:rgba(var(--carb-rgb),0.10);} .macro-card.carb .macro-val{color:var(--carb);}
  .macro-card.fat{border-top:3px solid var(--fat);background:rgba(var(--fat-rgb),0.10);}   .macro-card.fat .macro-val{color:var(--fat);}
  .macro-card.fib{border-top:3px solid var(--fib);background:rgba(var(--fib-rgb),0.10);}   .macro-card.fib .macro-val{color:var(--fib);}

  /* CARD SECTIONS */
  .add-section,.log-section,.ing-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;}
  .ing-section{margin-bottom:0;}
  .add-header{background:linear-gradient(120deg,var(--acc-soft),transparent);padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
  .add-header .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);}
  .add-header h3{font-family:var(--head);font-size:15px;font-weight:600;color:var(--text);}
  .add-body{padding:14px 16px;}

  /* MEAL CHIPS */
  .meal-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .meal-chip{font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:0.02em;padding:7px 13px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--muted);cursor:pointer;transition:.15s;}
  .meal-chip:hover{color:var(--text);}
  .meal-chip.active{background:var(--acc);border-color:var(--acc);color:#04121e;}

  /* SEARCH */
  .search-row{margin-bottom:10px;}
  .search-input{font-family:var(--font);font-size:15px;width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);transition:border-color .15s;}
  .search-input:focus{outline:none;border-color:var(--acc);}
  .search-results{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;display:none;background:var(--surface-2);}
  .search-result-item{padding:11px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .12s;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:var(--elev);}
  .result-name{font-size:13px;font-weight:600;color:var(--text);}
  .result-brand{font-size:10px;color:var(--muted);margin-top:2px;}
  .result-macros{font-size:10px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}

  /* FOOD ENTRY */
  .food-entry{display:none;flex-direction:column;gap:11px;}
  .food-entry.visible{display:flex;}
  .selected-food-name{font-size:13px;font-weight:600;color:var(--acc);padding:9px 12px;background:var(--acc-soft);border-radius:8px;display:flex;justify-content:space-between;align-items:center;}
  .clear-food{font-size:11px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--font);}
  .clear-food:hover{color:var(--fat);}
  .entry-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .entry-field{display:flex;flex-direction:column;gap:5px;}
  .entry-field label{font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  .entry-input{font-family:var(--head);font-size:16px;font-weight:600;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);transition:border-color .15s;}
  .entry-input:focus{outline:none;border-color:var(--acc);}
  .entry-input[readonly]{color:var(--muted);cursor:default;background:var(--surface);}
  select.entry-input{cursor:pointer;color-scheme:dark;}

  /* MACRO PREVIEW */
  .macro-preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:11px 12px;background:var(--surface-2);border-radius:9px;border:1px solid var(--border);}
  .preview-item{text-align:center;}
  .preview-val{font-family:var(--head);font-size:14px;font-weight:700;display:block;font-variant-numeric:tabular-nums;}
  .preview-lbl{font-size:9px;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;margin-top:2px;display:block;}

  /* MANUAL */
  .manual-toggle{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;background:none;border:none;font-family:var(--font);padding:0;margin-top:2px;display:block;}
  .manual-toggle:hover{color:var(--acc);}
  .manual-macros{display:none;grid-template-columns:repeat(5,1fr);gap:6px;}
  .manual-macros.visible{display:grid;}
  .manual-field{display:flex;flex-direction:column;gap:4px;}
  .manual-field label{font-size:9px;letter-spacing:0.05em;text-transform:uppercase;color:var(--faint);font-weight:600;}
  .manual-field input{font-family:var(--head);font-size:15px;font-weight:600;padding:8px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);text-align:center;width:100%;}
  .manual-field input:focus{outline:none;border-color:var(--acc);}

  /* BUTTONS */
  .add-btn{width:100%;padding:14px;font-family:var(--head);font-size:12.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;border:none;border-radius:11px;background:var(--acc);color:#04121e;cursor:pointer;transition:transform .1s,filter .15s;margin-top:4px;box-shadow:0 6px 20px -8px var(--acc);}
  .add-btn:hover{filter:brightness(1.08);}
  .add-btn:active{transform:scale(.985);}
  .add-btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;}

  .status-msg{font-size:11.5px;text-align:center;min-height:16px;margin-top:9px;letter-spacing:0.02em;font-weight:500;}
  .status-msg.success{color:var(--ok);}
  .status-msg.error{color:var(--bad);}

  /* FOOD LOG */
  .log-header{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .log-header h3{font-family:var(--head);font-size:15px;font-weight:600;color:var(--text);}
  .log-count{font-size:11px;color:var(--muted);}
  .log-empty{padding:22px 16px;font-size:12.5px;color:var(--muted);font-style:italic;text-align:center;}
  .meal-group-label{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--faint);padding:9px 16px 5px;background:var(--surface-2);border-bottom:1px solid var(--border-soft);}
  .log-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border-soft);align-items:center;}
  .log-item:last-child{border-bottom:none;}
  .log-food-name{font-size:12.5px;font-weight:600;color:var(--text);}
  .log-food-amount{font-size:11px;color:var(--muted);margin-top:2px;}
  .log-food-macros{display:flex;gap:9px;font-size:10px;color:var(--muted);margin-top:5px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
  .log-food-macros span{white-space:nowrap;}
  .log-kcal{font-family:var(--head);font-size:15px;font-weight:700;color:var(--cal);white-space:nowrap;font-variant-numeric:tabular-nums;}

  /* INGREDIENT SECTION */
  .ing-header{background:var(--surface-2);padding:13px 16px;border-bottom:1px solid var(--border);}
  .ing-header h3{font-family:var(--head);font-size:15px;font-weight:600;color:var(--text);}
  .ing-header .sub{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.03em;}
  .ing-body{padding:14px 16px 18px;}
  .ing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
  .ing-field{display:flex;flex-direction:column;gap:5px;}
  .ing-field.full{grid-column:span 3;}
  .ing-field label{font-size:9px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--faint);}
  .ing-input{font-family:var(--head);font-size:15px;font-weight:600;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);width:100%;transition:border-color .15s;}
  .ing-input:focus{outline:none;border-color:var(--acc);}
  select.ing-input{cursor:pointer;color-scheme:dark;}
  .ing-btn{width:100%;padding:13px;font-family:var(--head);font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;border:1.5px solid var(--acc);border-radius:11px;background:transparent;color:var(--acc);cursor:pointer;transition:.15s;}
  .ing-btn:hover{background:var(--acc-soft);}
  .ing-btn:active{transform:scale(.985);}
  .ing-btn:disabled{opacity:.55;cursor:not-allowed;}

  /* MODE TOGGLE (food vs meal) */
  .mode-toggle{display:flex;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:14px;}
  .mode-btn{flex:1;font-family:var(--font);font-size:12px;font-weight:600;padding:9px;border:none;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:.15s;}
  .mode-btn.active{background:var(--acc);color:#04121e;}

  /* MEAL DETAIL (when logging a meal) */
  .meal-ing-list{display:flex;flex-direction:column;gap:8px;}
  .meal-ing-row{display:grid;grid-template-columns:1fr 74px 42px;gap:8px;align-items:center;}
  .meal-ing-name{font-size:12.5px;font-weight:600;color:var(--text);}
  .meal-ing-sub{font-size:10px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}
  .meal-ing-amt{font-family:var(--head);font-size:15px;font-weight:600;padding:8px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);text-align:center;width:100%;}
  .meal-ing-amt:focus{outline:none;border-color:var(--acc);}
  .meal-ing-unit{font-size:11px;color:var(--muted);text-align:center;}
  .meal-total{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:11px 12px;background:var(--surface-2);border-radius:9px;border:1px solid var(--border);}
  .meal-total .mt-cal{font-family:var(--head);font-size:16px;font-weight:700;color:var(--cal);font-variant-numeric:tabular-nums;}
  .meal-total .mt-macros{font-size:10px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}

  /* MEAL BUILDER (Add Meal) */
  .meal-build-row{display:grid;grid-template-columns:1fr 56px 30px 30px;gap:6px;align-items:center;margin-bottom:8px;}
  .meal-build-row .meal-ing-amt{font-size:14px;padding:8px 6px;}
  .meal-build-row .meal-ing-unit{font-size:10px;}
  .row-x{width:30px;height:30px;border:1.5px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;line-height:1;}
  .row-x:hover{border-color:var(--fat);color:var(--fat);}
  .add-ing-row-btn{width:100%;padding:9px;font-family:var(--font);font-size:11px;font-weight:600;border:1.5px dashed var(--border);border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;margin-bottom:12px;transition:.15s;}
  .add-ing-row-btn:hover{border-color:var(--acc);color:var(--acc);}

  @media (max-width:500px){
    .header{padding:22px 14px 0;}
    .content{padding:0 14px;}
    .macro-summary{grid-template-columns:repeat(3,1fr);}
    .entry-row{grid-template-columns:1fr;}
    .macro-preview{grid-template-columns:repeat(3,1fr);}
    .manual-macros{grid-template-columns:repeat(3,1fr);}
    .ing-grid{grid-template-columns:repeat(2,1fr);}
    .ing-field.full{grid-column:span 2;}
  }
</style>
</head>
<body>

<div class="header">
  <h1>Food Tracker</h1>
</div>

<div class="content">

  <div class="history-section" style="margin-top:6px;">
    <div class="block-label">History</div>
    <div class="history-scroll" id="history-scroll">
      <div class="hint">Loading history…</div>
    </div>
  </div>

  <div class="date-bar">
    <label>Date</label>
    <input type="date" id="selected-date" onchange="onDateChange()">
    <button class="today-btn" onclick="goToToday()">Today</button>
  </div>

  <div class="targets-row">
    <div class="target-field">
      <label>Maintenance</label>
      <input type="number" class="target-input" id="target-maintenance" placeholder="2100" oninput="onTargetChange()">
    </div>
    <div class="target-field">
      <label>Goal</label>
      <input type="number" class="target-input" id="target-goal" placeholder="2500" oninput="onTargetChange()">
    </div>
    <button class="save-targets-btn" id="save-targets-btn" onclick="saveTargets()">Save</button>
  </div>

  <div class="macro-summary">
    <div class="macro-card cal"><span class="macro-val" id="sum-cal">0</span><span class="macro-lbl">Calories</span></div>
    <div class="macro-card pro"><span class="macro-val" id="sum-pro">0g</span><span class="macro-lbl">Protein</span></div>
    <div class="macro-card carb"><span class="macro-val" id="sum-carb">0g</span><span class="macro-lbl">Carbs</span></div>
    <div class="macro-card fat"><span class="macro-val" id="sum-fat">0g</span><span class="macro-lbl">Fat</span></div>
    <div class="macro-card fib"><span class="macro-val" id="sum-fib">0g</span><span class="macro-lbl">Fiber</span></div>
  </div>

  <div class="add-section">
    <div class="add-header"><span class="dot"></span><h3>Log Food</h3></div>
    <div class="add-body">
      <div class="meal-chips">
        <button class="meal-chip active" onclick="selectMeal(this,'Breakfast')">Breakfast</button>
        <button class="meal-chip" onclick="selectMeal(this,'Lunch')">Lunch</button>
        <button class="meal-chip" onclick="selectMeal(this,'Dinner')">Dinner</button>
        <button class="meal-chip" onclick="selectMeal(this,'Pre-Workout')">Pre-Workout</button>
        <button class="meal-chip" onclick="selectMeal(this,'Snack')">Snack</button>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="food" onclick="setMode('food')">Single food</button>
        <button class="mode-btn" data-mode="meal" onclick="setMode('meal')">Meal</button>
      </div>
      <div id="food-mode">
      <div class="search-row">
        <input type="text" class="search-input" id="food-search" placeholder="Type to search food…" oninput="liveSearch(this.value)">
      </div>
      <div class="search-results" id="search-results"></div>
      <div class="food-entry" id="food-entry">
        <div class="selected-food-name">
          <span id="selected-food-text"></span>
          <button class="clear-food" onclick="clearFood()">✕ clear</button>
        </div>
        <div class="entry-row">
          <div class="entry-field">
            <label>Amount</label>
            <input type="number" class="entry-input" id="food-amount" placeholder="100" min="1" oninput="updatePreview()">
          </div>
          <div class="entry-field">
            <label>Unit</label>
            <input class="entry-input unit-readonly" id="food-unit" readonly value="g">
          </div>
        </div>
        <div class="macro-preview">
          <div class="preview-item"><span class="preview-val" id="prev-cal" style="color:var(--cal)">—</span><span class="preview-lbl">kcal</span></div>
          <div class="preview-item"><span class="preview-val" id="prev-pro" style="color:var(--pro)">—</span><span class="preview-lbl">protein</span></div>
          <div class="preview-item"><span class="preview-val" id="prev-carb" style="color:var(--carb)">—</span><span class="preview-lbl">carbs</span></div>
          <div class="preview-item"><span class="preview-val" id="prev-fat" style="color:var(--fat)">—</span><span class="preview-lbl">fat</span></div>
          <div class="preview-item"><span class="preview-val" id="prev-fib" style="color:var(--fib)">—</span><span class="preview-lbl">fiber</span></div>
        </div>
        <button class="manual-toggle" id="manual-toggle" onclick="toggleManual()">Enter macros manually instead</button>
        <div class="manual-macros" id="manual-macros">
          <div class="manual-field"><label>kcal</label><input type="number" id="man-cal" placeholder="0" oninput="updateManualPreview()"></div>
          <div class="manual-field"><label>protein</label><input type="number" id="man-pro" placeholder="0" step="0.1" oninput="updateManualPreview()"></div>
          <div class="manual-field"><label>carbs</label><input type="number" id="man-carb" placeholder="0" step="0.1" oninput="updateManualPreview()"></div>
          <div class="manual-field"><label>fat</label><input type="number" id="man-fat" placeholder="0" step="0.1" oninput="updateManualPreview()"></div>
          <div class="manual-field"><label>fiber</label><input type="number" id="man-fib" placeholder="0" step="0.1" oninput="updateManualPreview()"></div>
        </div>
      </div>
      <button class="add-btn" id="add-btn" onclick="addFood()">Add to Log</button>
      <div class="status-msg" id="add-status"></div>
      </div><!-- /food-mode -->
      <div id="meal-mode" hidden>
        <div class="search-row">
          <input type="text" class="search-input" id="meal-search" placeholder="Search your saved meals…" oninput="mealSearch(this.value)">
        </div>
        <div class="search-results" id="meal-results"></div>
        <div class="food-entry" id="meal-detail"></div>
        <button class="add-btn" id="log-meal-btn" onclick="logMeal()" style="display:none;">Log Meal</button>
        <div class="status-msg" id="meal-status"></div>
      </div>
    </div>
  </div>

  <div class="log-section">
    <div class="log-header">
      <h3>Today's Log</h3>
      <span class="log-count" id="log-count">0 items</span>
    </div>
    <div id="food-log-body">
      <div class="log-empty">No foods logged yet — add something above!</div>
    </div>
  </div>

  <div class="ing-section">
    <div class="ing-header"><h3>Add Ingredient</h3></div>
    <div class="ing-body">
      <div class="ing-grid">
        <div class="ing-field full"><label>Name</label><input type="text" class="ing-input" id="ing-name" placeholder="e.g. Greek yogurt"></div>
        <div class="ing-field"><label>Calories</label><input type="number" class="ing-input" id="ing-cal" placeholder="0" min="0"></div>
        <div class="ing-field"><label>Protein (g)</label><input type="number" class="ing-input" id="ing-pro" placeholder="0" min="0" step="0.1"></div>
        <div class="ing-field"><label>Carbs (g)</label><input type="number" class="ing-input" id="ing-carb" placeholder="0" min="0" step="0.1"></div>
        <div class="ing-field"><label>Fat (g)</label><input type="number" class="ing-input" id="ing-fat" placeholder="0" min="0" step="0.1"></div>
        <div class="ing-field"><label>Fiber (g)</label><input type="number" class="ing-input" id="ing-fib" placeholder="0" min="0" step="0.1"></div>
        <div class="ing-field"><label>Per</label>
          <select class="ing-input" id="ing-per">
            <option value="100g">100g</option>
            <option value="100ml">100ml</option>
            <option value="serving">serving</option>
          </select>
        </div>
      </div>
      <button class="ing-btn" id="ing-btn" onclick="addIngredient()">Add Ingredient</button>
      <div class="status-msg" id="ing-status"></div>
    </div>
  </div>

  <div class="ing-section" style="margin-top:16px;">
    <div class="ing-header"><h3>Add Meal</h3></div>
    <div class="ing-body">
      <div class="ing-field full" style="margin-bottom:12px;"><label>Meal name</label><input type="text" class="ing-input" id="meal-name" placeholder="e.g. eggs breakfast"></div>
      <div id="meal-builder-rows"></div>
      <button class="add-ing-row-btn" onclick="addMealRow()">+ add ingredient</button>
      <button class="ing-btn" id="meal-save-btn" onclick="saveMeal()">Save Meal</button>
      <div class="status-msg" id="meal-save-status"></div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgx80NQtp43UZs-SOHlEhGIPuCSVNaOjamjcBISKZTdqA-KkQpVEOlz4CySLO2TA7Z1g/exec";

let selectedMeal = "Breakfast";
let selectedFood = null;
let isManual = false;
let allFoodLog = [];
let ingredients = [];
let currentDate = "";
let allTargets = [];
let currentTargets = { maintenance: null, goal: null };
let meals = [];
let mealToLog = null;

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  const today = new Date();
  currentDate = formatDate(today);
  document.getElementById("selected-date").value = toInputDate(today);
  loadIngredients();
  loadTargets();
  loadFoodLog();
  loadMeals();
});

// ── HELPERS ───────────────────────────────────────────────────────────────────
function pad2(n){ return String(n).padStart(2,"0"); }
function formatDate(d) { return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; }
// LOCAL date (not UTC) — avoids the date picker jumping a day in +04:00.
function toInputDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function inputToDisplayDate(val) { const [y,m,d] = val.split("-"); return `${d}/${m}/${y}`; }
function shortDate(full) {
  if (!full) return "—";
  full = String(full);
  if (full.includes("/")) return full.substring(0,5);
  if (full.includes("-")) { const p = full.split("-"); return `${p[2]}/${p[1]}`; }
  return full.substring(0,5);
}
function normaliseDate(d) {
  d = String(d);
  if (d.includes("/")) return d;
  if (d.includes("T")) d = d.split("T")[0];          // ISO timestamp -> date part
  if (d.includes("-")) { const p = d.split("-"); if (p[0].length === 4) return `${p[2]}/${p[1]}/${p[0]}`; }
  return d;
}
function dateToMs(d) {
  const p = String(d).split("/");
  return new Date(`${p[2]}-${p[1]}-${p[0]}`).getTime();
}

// ── DATE ──────────────────────────────────────────────────────────────────────
function onDateChange() {
  const val = document.getElementById("selected-date").value;
  if (!val) return;
  currentDate = inputToDisplayDate(val);
  applyTargetsForDate(currentDate);
  renderDayLog();
  renderMacroSummary();
  updateHistoryActive();
  document.querySelector(".log-header h3").textContent = shortDate(currentDate) + " Log";
}
function goToToday() {
  const today = new Date();
  currentDate = formatDate(today);
  document.getElementById("selected-date").value = toInputDate(today);
  applyTargetsForDate(currentDate);
  renderDayLog();
  renderMacroSummary();
  updateHistoryActive();
  document.querySelector(".log-header h3").textContent = "Today's Log";
}

// ── TARGETS ───────────────────────────────────────────────────────────────────
async function loadTargets() {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getTargets`);
    const json = await res.json();
    allTargets = (json.targets || []).map(t => ({ ...t, date: normaliseDate(t.date) }));
  } catch(e) { allTargets = []; }
  applyTargetsForDate(currentDate);
  renderHistory();
}
function applyTargetsForDate(date) {
  let target = allTargets.find(t => t.date === date);
  if (!target) {
    const dMs = dateToMs(date);
    const prev = allTargets.filter(t => dateToMs(t.date) < dMs).sort((a,b) => dateToMs(b.date) - dateToMs(a.date));
    target = prev[0] || null;
  }
  currentTargets = target ? { maintenance: +target.maintenance, goal: +target.goal } : { maintenance: null, goal: null };
  document.getElementById("target-maintenance").value = currentTargets.maintenance || "";
  document.getElementById("target-goal").value = currentTargets.goal || "";
  renderHistory();
}
function onTargetChange() {
  currentTargets.maintenance = +document.getElementById("target-maintenance").value || null;
  currentTargets.goal = +document.getElementById("target-goal").value || null;
}
async function saveTargets() {
  const maintenance = +document.getElementById("target-maintenance").value || 0;
  const goal = +document.getElementById("target-goal").value || 0;
  const btn = document.getElementById("save-targets-btn");
  btn.textContent = "Saving…";
  await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "saveTargets", date: currentDate, maintenance, goal }) });
  const idx = allTargets.findIndex(t => t.date === currentDate);
  if (idx >= 0) allTargets[idx] = { date: currentDate, maintenance, goal };
  else allTargets.push({ date: currentDate, maintenance, goal });
  currentTargets = { maintenance, goal };
  btn.textContent = "Saved ✓";
  btn.classList.add("saved");
  setTimeout(() => { btn.textContent = "Save"; btn.classList.remove("saved"); }, 2000);
  renderHistory();
}

// ── MEAL CHIPS ────────────────────────────────────────────────────────────────
function selectMeal(el, meal) {
  document.querySelectorAll(".meal-chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  selectedMeal = meal;
}

// ── INGREDIENTS LOAD ──────────────────────────────────────────────────────────
async function loadIngredients() {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getIngredients`);
    const json = await res.json();
    ingredients = json.ingredients || [];
  } catch(e) { ingredients = []; }
  seedMealBuilder();
}

// ── LIVE SEARCH ───────────────────────────────────────────────────────────────
function liveSearch(query) {
  const container = document.getElementById("search-results");
  if (!query || query.length < 1) { container.style.display = "none"; return; }
  const q = query.toLowerCase();
  const matches = ingredients.filter(i => i.name.toLowerCase().includes(q)).slice(0, 10);
  container.style.display = "block";
  if (!matches.length) {
    container.innerHTML = `<div class="search-result-item" onclick="showManualEntry()"><div><div class="result-name">"${query}" — not in your ingredients</div><div class="result-brand" style="color:var(--acc)">Tap to enter macros manually →</div></div></div>`;
    return;
  }
  container.innerHTML = matches.map(ing => `<div class="search-result-item" onclick='selectIngredient(${JSON.stringify(ing).replace(/'/g,"&#39;")})'><div><div class="result-name">${ing.name}</div><div class="result-brand">per ${ing.per || "100g"}</div></div><div class="result-macros">${ing.calories} kcal<br>${ing.protein}g pro</div></div>`).join("");
}

function selectIngredient(ing) {
  selectedFood = { name: ing.name, per: ing.per || "100g", per100: { cal: +ing.calories, pro: +ing.protein, carb: +ing.carbs, fat: +ing.fat, fib: +ing.fiber } };
  isManual = false;
  document.getElementById("search-results").style.display = "none";
  document.getElementById("food-search").value = "";
  document.getElementById("selected-food-text").textContent = ing.name;
  document.getElementById("food-entry").classList.add("visible");
  document.getElementById("manual-macros").classList.remove("visible");
  document.getElementById("manual-toggle").textContent = "Enter macros manually instead";
  document.getElementById("manual-toggle").style.display = "block";
  const unitEl = document.getElementById("food-unit");
  unitEl.readOnly = true;
  unitEl.value = perUnit(ing.per);                 // unit is fixed by the sheet's Per column
  document.getElementById("food-amount").value = perQty(ing.per); // default = one listed portion
  updatePreview();
}

function showManualEntry() {
  selectedFood = null;
  isManual = true;
  const name = document.getElementById("food-search").value.trim() || "Custom food";
  document.getElementById("selected-food-text").textContent = name;
  document.getElementById("food-entry").classList.add("visible");
  document.getElementById("manual-macros").classList.add("visible");
  document.getElementById("manual-toggle").style.display = "none";
  document.getElementById("food-amount").value = "100";
  const mu = document.getElementById("food-unit"); mu.readOnly = false; mu.value = "g";
  clearPrev();
}

function clearFood() {
  selectedFood = null; isManual = false;
  document.getElementById("food-entry").classList.remove("visible");
  document.getElementById("search-results").style.display = "none";
  document.getElementById("food-search").value = "";
  document.getElementById("manual-macros").classList.remove("visible");
  document.getElementById("manual-toggle").style.display = "block";
  document.getElementById("manual-toggle").textContent = "Enter macros manually instead";
  clearPrev();
}

function toggleManual() {
  isManual = !isManual;
  const mm = document.getElementById("manual-macros");
  const mt = document.getElementById("manual-toggle");
  if (isManual) { mm.classList.add("visible"); mt.textContent = "Use search instead"; selectedFood = null; clearPrev(); }
  else { mm.classList.remove("visible"); mt.textContent = "Enter macros manually instead"; updatePreview(); }
}

// ── PREVIEW ───────────────────────────────────────────────────────────────────
function updatePreview() {
  if (!selectedFood) return;
  const amt = parseFloat(document.getElementById("food-amount").value) || 0;
  const ratio = amt / perQty(selectedFood.per);
  const p = selectedFood.per100;
  setPrev(Math.round(p.cal*ratio), +(p.pro*ratio).toFixed(1), +(p.carb*ratio).toFixed(1), +(p.fat*ratio).toFixed(1), +(p.fib*ratio).toFixed(1));
}
function updateManualPreview() {
  setPrev(document.getElementById("man-cal").value||"—", document.getElementById("man-pro").value||"—", document.getElementById("man-carb").value||"—", document.getElementById("man-fat").value||"—", document.getElementById("man-fib").value||"—");
}
function setPrev(cal,pro,carb,fat,fib) {
  document.getElementById("prev-cal").textContent = cal;
  document.getElementById("prev-pro").textContent = pro;
  document.getElementById("prev-carb").textContent = carb;
  document.getElementById("prev-fat").textContent = fat;
  document.getElementById("prev-fib").textContent = fib;
}
function clearPrev() { setPrev("—","—","—","—","—"); }

// ── ADD FOOD ──────────────────────────────────────────────────────────────────
async function addFood() {
  const statusEl = document.getElementById("add-status");
  const btn = document.getElementById("add-btn");
  const amt = parseFloat(document.getElementById("food-amount").value);
  const unit = document.getElementById("food-unit").value;
  const foodName = document.getElementById("selected-food-text").textContent;
  if (!foodName) { statusEl.textContent = "Please select a food."; statusEl.className = "status-msg error"; return; }
  if (!amt || amt <= 0) { statusEl.textContent = "Please enter an amount."; statusEl.className = "status-msg error"; return; }
  let cal, pro, carb, fat, fib;
  if (isManual) {
    cal = parseFloat(document.getElementById("man-cal").value)||0;
    pro = parseFloat(document.getElementById("man-pro").value)||0;
    carb = parseFloat(document.getElementById("man-carb").value)||0;
    fat = parseFloat(document.getElementById("man-fat").value)||0;
    fib = parseFloat(document.getElementById("man-fib").value)||0;
  } else if (selectedFood) {
    const ratio = amt / perQty(selectedFood.per);
    const p = selectedFood.per100;
    cal = Math.round(p.cal*ratio); pro = +(p.pro*ratio).toFixed(1); carb = +(p.carb*ratio).toFixed(1); fat = +(p.fat*ratio).toFixed(1); fib = +(p.fib*ratio).toFixed(1);
  } else { statusEl.textContent = "Please select a food first."; statusEl.className = "status-msg error"; return; }
  btn.disabled = true; btn.textContent = "Adding…"; statusEl.textContent = "";
  const row = { date: currentDate, meal: selectedMeal, food: foodName, amount: amt, unit, calories: cal, protein: pro, carbs: carb, fat, fiber: fib };
  try {
    await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "addFood", row }) });
    allFoodLog.push(row);
    renderDayLog(); renderMacroSummary(); renderHistory();
    clearFood();
    statusEl.textContent = `${foodName} added!`; statusEl.className = "status-msg success";
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  } catch(e) { statusEl.textContent = "Error. Try again."; statusEl.className = "status-msg error"; }
  btn.disabled = false; btn.textContent = "Add to Log";
}

// ── LOAD FOOD LOG ─────────────────────────────────────────────────────────────
async function loadFoodLog() {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getFoodLog`);
    const json = await res.json();
    allFoodLog = (json.rows || []).map(r => ({ ...r, date: normaliseDate(r.date) }));
  } catch(e) { allFoodLog = []; }
  renderHistory(); renderDayLog(); renderMacroSummary();
}

// ── RENDER DAY LOG ────────────────────────────────────────────────────────────
function renderDayLog() {
  const dayRows = allFoodLog.filter(r => r.date === currentDate);
  const body = document.getElementById("food-log-body");
  document.getElementById("log-count").textContent = `${dayRows.length} item${dayRows.length !== 1 ? "s" : ""}`;
  if (!dayRows.length) { body.innerHTML = `<div class="log-empty">No foods logged for this day yet.</div>`; return; }
  const meals = ["Breakfast","Lunch","Pre-Workout","Dinner","Snack"];
  let html = "";
  meals.forEach(meal => {
    const items = dayRows.filter(r => r.meal === meal);
    if (!items.length) return;
    html += `<div class="meal-group-label">${meal}</div>`;
    items.forEach(r => { html += `<div class="log-item"><div><div class="log-food-name">${r.food}</div><div class="log-food-amount">${r.amount}${r.unit}</div><div class="log-food-macros"><span style="color:var(--pro)">${r.protein}g protein</span><span style="color:var(--carb)">${r.carbs}g carbs</span><span style="color:var(--fat)">${r.fat}g fat</span><span style="color:var(--fib)">${r.fiber}g fiber</span></div></div><div class="log-kcal">${r.calories} kcal</div></div>`; });
  });
  body.innerHTML = html;
}

// ── MACRO SUMMARY ─────────────────────────────────────────────────────────────
function renderMacroSummary() {
  const totals = allFoodLog.filter(r => r.date === currentDate).reduce((acc,r) => { acc.cal += +r.calories||0; acc.pro += +r.protein||0; acc.carb += +r.carbs||0; acc.fat += +r.fat||0; acc.fib += +r.fiber||0; return acc; }, {cal:0,pro:0,carb:0,fat:0,fib:0});
  document.getElementById("sum-cal").textContent  = Math.round(totals.cal);
  document.getElementById("sum-pro").textContent  = totals.pro.toFixed(1)+"g";
  document.getElementById("sum-carb").textContent = totals.carb.toFixed(1)+"g";
  document.getElementById("sum-fat").textContent  = totals.fat.toFixed(1)+"g";
  document.getElementById("sum-fib").textContent  = totals.fib.toFixed(1)+"g";
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function renderHistory() {
  const scroll = document.getElementById("history-scroll");
  const dateMap = {};
  allFoodLog.forEach(r => { if (!dateMap[r.date]) dateMap[r.date] = {cal:0,pro:0}; dateMap[r.date].cal += +r.calories||0; dateMap[r.date].pro += +r.protein||0; });
  const dates = Object.keys(dateMap).sort((a,b) => dateToMs(b) - dateToMs(a));
  if (!dates.length) { scroll.innerHTML = `<div class="hint">No history yet</div>`; return; }
  scroll.innerHTML = dates.map(d => {
    const isActive = d === currentDate;
    const totalCal = Math.round(dateMap[d].cal);
    const totalPro = dateMap[d].pro.toFixed(0);
    const dMs = dateToMs(d);
    let goalForDay = null;
    const exact = allTargets.find(t => t.date === d);
    if (exact) { goalForDay = +exact.goal; }
    else { const prev = allTargets.filter(t => dateToMs(t.date) < dMs).sort((a,b) => dateToMs(b.date)-dateToMs(a.date)); if (prev[0]) goalForDay = +prev[0].goal; }
    let colorClass = "", surplusHtml = "";
    if (goalForDay) {
      const diff = totalCal - goalForDay;
      const maintenance = (() => {
        const exact2 = allTargets.find(t => t.date === d);
        if (exact2) return +exact2.maintenance;
        const prev2 = allTargets.filter(t => dateToMs(t.date) < dMs).sort((a,b) => dateToMs(b.date)-dateToMs(a.date));
        return prev2[0] ? +prev2[0].maintenance : goalForDay;
      })();
      const isCut = goalForDay <= maintenance;
      const goalMet = isCut ? diff <= 0 : diff >= 0;
      colorClass = goalMet ? "goal-met" : "goal-missed";
      surplusHtml = `<span class="chip-surplus">${diff>=0?"+":""}${diff} kcal</span>`;
    }
    return `<div class="history-chip ${isActive?"active":""} ${colorClass}" onclick="selectHistoryDate('${d}')"><span class="chip-date">${shortDate(d)}</span><span class="chip-cals">${totalCal} kcal</span><span class="chip-pro">${totalPro}g pro</span>${surplusHtml}</div>`;
  }).join("");
}

function updateHistoryActive() {
  document.querySelectorAll(".history-chip").forEach(c => { c.classList.toggle("active", c.querySelector(".chip-date").textContent === shortDate(currentDate)); });
}

function selectHistoryDate(date) {
  currentDate = date;
  const parts = date.split("/");
  document.getElementById("selected-date").value = `${parts[2]}-${parts[1]}-${parts[0]}`;
  applyTargetsForDate(date);
  renderDayLog(); renderMacroSummary(); updateHistoryActive();
  document.querySelector(".log-header h3").textContent = date === formatDate(new Date()) ? "Today's Log" : shortDate(date) + " Log";
}

// ── ADD INGREDIENT ────────────────────────────────────────────────────────────
async function addIngredient() {
  const btn = document.getElementById("ing-btn");
  const statusEl = document.getElementById("ing-status");
  const name = document.getElementById("ing-name").value.trim();
  if (!name) { statusEl.textContent = "Please enter a name."; statusEl.className = "status-msg error"; return; }
  const cal  = parseFloat(document.getElementById("ing-cal").value)||0;
  const pro  = parseFloat(document.getElementById("ing-pro").value)||0;
  const carb = parseFloat(document.getElementById("ing-carb").value)||0;
  const fat  = parseFloat(document.getElementById("ing-fat").value)||0;
  const fib  = parseFloat(document.getElementById("ing-fib").value)||0;
  const per  = document.getElementById("ing-per").value;
  btn.disabled = true; btn.textContent = "Adding…"; statusEl.textContent = "";
  try {
    await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "addIngredient", ingredient: { name, calories: cal, protein: pro, carbs: carb, fat, fiber: fib, per } }) });
    ingredients.push({ name, calories: cal, protein: pro, carbs: carb, fat, fiber: fib, per });
    ["ing-name","ing-cal","ing-pro","ing-carb","ing-fat","ing-fib"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("ing-per").value = "100g";
    statusEl.textContent = `${name} added!`; statusEl.className = "status-msg success";
    setTimeout(() => { statusEl.textContent = ""; }, 3000);
  } catch(err) { statusEl.textContent = "Error. Try again."; statusEl.className = "status-msg error"; }
  btn.disabled = false; btn.textContent = "Add Ingredient";
}

// ── MEALS ─────────────────────────────────────────────────────────────────────
function perToUnit(per){ per = String(per||"100g").toLowerCase(); if (per.includes("ml")) return "ml"; if (per === "serving") return "serving"; return "g"; }
function perUnit(per){ return perToUnit(per); }
// The numeric quantity the sheet macros are stated for: "serving"->1, "250ml"->250, "15ml"->15, "100g"->100, "20g"->20.
function perQty(per){ per = String(per||"").trim().toLowerCase(); if (per === "serving" || per === "") return 1; const n = parseFloat(per); return (!isFinite(n) || n <= 0) ? 1 : n; }
function findIng(name){ const n = String(name).toLowerCase().trim(); return ingredients.find(i => i.name.toLowerCase().trim() === n); }
function macrosFor(ing, amt){
  const ratio = amt / perQty(ing.per);
  return {
    calories: Math.round((+ing.calories||0)*ratio),
    protein: +((+ing.protein||0)*ratio).toFixed(1),
    carbs:   +((+ing.carbs||0)*ratio).toFixed(1),
    fat:     +((+ing.fat||0)*ratio).toFixed(1),
    fiber:   +((+ing.fiber||0)*ratio).toFixed(1)
  };
}
function mealKcal(m){ let c = 0; m.ingredients.forEach(x => { const ing = findIng(x.ingredient); if (ing) c += macrosFor(ing, +x.amount||0).calories; }); return Math.round(c); }

async function loadMeals(){
  try { const res = await fetch(`${SCRIPT_URL}?action=getMeals`); const json = await res.json(); meals = json.meals || []; }
  catch(e) { meals = []; }
}

// mode toggle
function setMode(mode){
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.getElementById("food-mode").hidden = mode !== "food";
  document.getElementById("meal-mode").hidden = mode !== "meal";
}

// ── LOG A MEAL ────────────────────────────────────────────────────────────────
function mealSearch(query){
  const container = document.getElementById("meal-results");
  if (!query || !query.length) { container.style.display = "none"; return; }
  const q = query.toLowerCase();
  const matches = meals.filter(m => m.name.toLowerCase().includes(q)).slice(0, 10);
  container.style.display = "block";
  if (!matches.length) { container.innerHTML = `<div class="search-result-item"><div><div class="result-name">No saved meal matches "${query}"</div><div class="result-brand">Build one in "Add Meal" below</div></div></div>`; return; }
  container.innerHTML = matches.map(m => { const n = m.ingredients.length; return `<div class="search-result-item" onclick="selectMealToLog('${m.name.replace(/'/g,"\\'")}')"><div><div class="result-name">${m.name}</div><div class="result-brand">${n} ingredient${n!==1?"s":""}</div></div><div class="result-macros">${mealKcal(m)} kcal</div></div>`; }).join("");
}
function selectMealToLog(name){
  const meal = meals.find(m => m.name === name) || meals.find(m => m.name.toLowerCase() === String(name).toLowerCase());
  if (!meal) return;
  mealToLog = JSON.parse(JSON.stringify(meal));
  document.getElementById("meal-results").style.display = "none";
  document.getElementById("meal-search").value = "";
  renderMealDetail();
  document.getElementById("log-meal-btn").style.display = "block";
}
function renderMealDetail(){
  const d = document.getElementById("meal-detail");
  if (!mealToLog) { d.classList.remove("visible"); d.innerHTML = ""; return; }
  let html = `<div class="selected-food-name"><span>${mealToLog.name}</span><button class="clear-food" onclick="clearMealToLog()">✕ clear</button></div><div class="meal-ing-list">`;
  mealToLog.ingredients.forEach((x, i) => {
    const ing = findIng(x.ingredient);
    const unit = x.unit || (ing ? perToUnit(ing.per) : "");
    html += `<div class="meal-ing-row"><div><div class="meal-ing-name">${x.ingredient}${!ing?' <span style="color:var(--fat)">(not in library)</span>':''}</div><div class="meal-ing-sub" id="mi-sub-${i}"></div></div>`+
            `<input type="number" class="meal-ing-amt" data-i="${i}" value="${x.amount}" min="0" step="0.1" inputmode="decimal" oninput="recalcMeal()">`+
            `<span class="meal-ing-unit">${unit}</span></div>`;
  });
  html += `</div><div class="meal-total"><span class="mt-cal" id="meal-total-cal">0 kcal</span><span class="mt-macros" id="meal-total-macros"></span></div>`;
  d.innerHTML = html; d.classList.add("visible");
  recalcMeal();
}
function recalcMeal(){
  if (!mealToLog) return;
  const tot = {calories:0,protein:0,carbs:0,fat:0,fiber:0};
  document.querySelectorAll("#meal-detail .meal-ing-amt").forEach(inp => {
    const i = +inp.dataset.i; const x = mealToLog.ingredients[i]; x.amount = parseFloat(inp.value)||0;
    const ing = findIng(x.ingredient); const sub = document.getElementById("mi-sub-"+i);
    if (ing) { const m = macrosFor(ing, x.amount); tot.calories+=m.calories; tot.protein+=m.protein; tot.carbs+=m.carbs; tot.fat+=m.fat; tot.fiber+=m.fiber; if (sub) sub.textContent = `${m.calories} kcal · ${m.protein}g P`; }
    else if (sub) sub.textContent = "—";
  });
  const c = document.getElementById("meal-total-cal"); if (c) c.textContent = Math.round(tot.calories)+" kcal";
  const mm = document.getElementById("meal-total-macros"); if (mm) mm.textContent = `${tot.protein.toFixed(1)}P · ${tot.carbs.toFixed(1)}C · ${tot.fat.toFixed(1)}F · ${tot.fiber.toFixed(1)}fib`;
}
function clearMealToLog(){ mealToLog = null; const d = document.getElementById("meal-detail"); d.innerHTML = ""; d.classList.remove("visible"); document.getElementById("log-meal-btn").style.display = "none"; }
async function logMeal(){
  const status = document.getElementById("meal-status");
  const btn = document.getElementById("log-meal-btn");
  if (!mealToLog) { status.textContent = "Pick a meal first."; status.className = "status-msg error"; return; }
  const rows = [];
  mealToLog.ingredients.forEach(x => {
    const ing = findIng(x.ingredient); const amt = parseFloat(x.amount);
    if (!ing || !amt || amt <= 0) return;
    const m = macrosFor(ing, amt);
    rows.push({ date: currentDate, meal: selectedMeal, food: x.ingredient, amount: amt, unit: x.unit || perToUnit(ing.per), calories: m.calories, protein: m.protein, carbs: m.carbs, fat: m.fat, fiber: m.fiber });
  });
  if (!rows.length) { status.textContent = "Nothing to log — are the ingredients in your library?"; status.className = "status-msg error"; return; }
  btn.disabled = true; btn.textContent = "Logging…"; status.textContent = "";
  const nm = mealToLog.name;
  try {
    await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "addFoods", rows }) });
    rows.forEach(r => allFoodLog.push(r));
    renderDayLog(); renderMacroSummary(); renderHistory();
    clearMealToLog();
    status.textContent = `${nm} logged — ${rows.length} item${rows.length!==1?"s":""} added to ${selectedMeal}!`; status.className = "status-msg success";
    setTimeout(() => { status.textContent = ""; }, 3000);
  } catch(e) { status.textContent = "Error. Try again."; status.className = "status-msg error"; }
  btn.disabled = false; btn.textContent = "Log Meal";
}

// ── ADD / EDIT A MEAL ─────────────────────────────────────────────────────────
function ingredientOptionsHTML(sel){
  return '<option value="">— pick ingredient —</option>' + ingredients.map(i => `<option value="${String(i.name).replace(/"/g,"&quot;")}"${i.name===sel?" selected":""}>${i.name}</option>`).join("");
}
function addMealRow(name, amt){
  const cont = document.getElementById("meal-builder-rows");
  const row = document.createElement("div"); row.className = "meal-build-row";
  row.innerHTML = `<select class="ing-input meal-ing-select" onchange="onMealRowChange(this)">${ingredientOptionsHTML(name||"")}</select>`+
                  `<input type="number" class="meal-ing-amt" placeholder="amt" value="${amt!=null?amt:""}" min="0" step="0.1" inputmode="decimal">`+
                  `<span class="meal-ing-unit"></span>`+
                  `<button class="row-x" onclick="removeMealRow(this)">✕</button>`;
  cont.appendChild(row);
  if (name) onMealRowChange(row.querySelector("select"));
}
function removeMealRow(el){ el.closest(".meal-build-row").remove(); }
function onMealRowChange(sel){
  const row = sel.closest(".meal-build-row");
  const ing = ingredients.find(i => i.name === sel.value);
  const unitSpan = row.querySelector(".meal-ing-unit");
  const amtInput = row.querySelector(".meal-ing-amt");
  if (ing) { unitSpan.textContent = perToUnit(ing.per); if (!amtInput.value) amtInput.value = perQty(ing.per); }
  else unitSpan.textContent = "";
}
function seedMealBuilder(){ const c = document.getElementById("meal-builder-rows"); if (c && !c.children.length) { addMealRow(); addMealRow(); } }
async function saveMeal(){
  const btn = document.getElementById("meal-save-btn");
  const status = document.getElementById("meal-save-status");
  const name = document.getElementById("meal-name").value.trim();
  if (!name) { status.textContent = "Please name the meal."; status.className = "status-msg error"; return; }
  const ings = [];
  document.querySelectorAll("#meal-builder-rows .meal-build-row").forEach(r => {
    const ingName = r.querySelector(".meal-ing-select").value;
    const amt = parseFloat(r.querySelector(".meal-ing-amt").value);
    if (ingName && amt > 0) { const ing = ingredients.find(i => i.name === ingName); ings.push({ ingredient: ingName, amount: amt, unit: perToUnit(ing ? ing.per : "g") }); }
  });
  if (!ings.length) { status.textContent = "Add at least one ingredient with an amount."; status.className = "status-msg error"; return; }
  btn.disabled = true; btn.textContent = "Saving…"; status.textContent = "";
  try {
    await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "addMeal", name, ingredients: ings }) });
    const idx = meals.findIndex(m => m.name.toLowerCase() === name.toLowerCase());
    const meal = { name, ingredients: ings };
    if (idx >= 0) meals[idx] = meal; else meals.push(meal);
    document.getElementById("meal-name").value = "";
    document.getElementById("meal-builder-rows").innerHTML = ""; seedMealBuilder();
    status.textContent = `"${name}" saved!`; status.className = "status-msg success";
    setTimeout(() => { status.textContent = ""; }, 3000);
  } catch(e) { status.textContent = "Error. Try again."; status.className = "status-msg error"; }
  btn.disabled = false; btn.textContent = "Save Meal";
}
</script>
